<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>Sport TV Guide</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f7f5;color:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif}button{font:inherit;border:0;background:none;color:inherit}.app{max-width:1200px;margin:auto;padding:20px 16px 40px}.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{font-size:28px;font-weight:700;letter-spacing:-.8px}.sub{font-size:13px;color:#777;margin-top:2px}.icon{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 1px 8px #0000000d;font-size:20px}.tabs{display:flex;background:#e9e9e7;border-radius:14px;padding:3px;margin-bottom:18px}.tab{flex:1;padding:10px 8px;border-radius:11px;font-weight:600;font-size:14px}.tab.active{background:#fff;box-shadow:0 1px 5px #00000012}.filters{display:flex;gap:8px;overflow:auto;padding-bottom:8px;margin-bottom:12px}.pill{white-space:nowrap;padding:9px 14px;border-radius:20px;background:#fff;color:#666;font-size:14px;box-shadow:0 1px 5px #00000008}.pill.active{background:#111;color:#fff}.panel{background:#fff;border-radius:20px;box-shadow:0 2px 14px #00000008;overflow:hidden}.guide{overflow:auto}.grid{min-width:17600px}.row{display:grid;grid-template-columns:155px 1fr;border-bottom:1px solid #eee;min-height:78px}.channel{padding:18px 14px;font-weight:650;border-right:1px solid #eee;position:sticky;left:0;background:#fff;z-index:2}.timeline{display:grid;grid-template-columns:repeat(144,120px);position:relative}.time{padding:10px 12px 0;color:#999;font-size:12px;border-right:1px solid #f0f0ef}.programme{margin:12px 8px;padding:10px 12px;border-radius:13px;background:#f2f2f0;min-width:0;grid-column:span 6}.programme.live{background:#111;color:#fff}.programme strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.programme span{font-size:11px;color:#777}.live span{color:#bbb}.event{padding:18px;border-bottom:1px solid #eee}.event:last-child{border-bottom:0}.eventtime{font-size:13px;color:#777;margin-bottom:5px}.eventtitle{font-size:18px;font-weight:700;letter-spacing:-.3px}.meta{font-size:13px;color:#777;margin-top:5px}.badge{display:inline-block;margin-top:10px;padding:5px 8px;border-radius:8px;background:#eee;font-size:11px;font-weight:600}.livebadge{background:#111;color:#fff}.hidden{display:none}@media(max-width:600px){.app{padding-top:16px}.brand{font-size:25px}.row{grid-template-columns:110px 1fr}.channel{font-size:13px;padding:18px 10px}.grid{min-width:17470px}.programme{margin-left:5px;margin-right:5px}.eventtitle{font-size:17px}}</style></head><body><main class="app"><header class="header"><div><div class="brand">Sport TV Guide</div><div class="sub" id="date"></div></div><button class="icon" aria-label="Favourites">☆</button></header><nav class="tabs"><button class="tab active" data-view="guide">Guide</button><button class="tab" data-view="sports">Sports</button><button class="tab" data-view="tonight">Tonight</button></nav><section id="guideView"><div class="filters"><button class="pill active">All channels</button><button class="pill">Favourites</button><button class="pill">TV</button><button class="pill">Streaming</button></div><div class="panel guide"><div class="grid"><div class="row"><div class="channel"></div><div class="timeline" id="times"></div></div><div id="channels"></div></div></div></section><section id="sportsView" class="hidden"><div class="filters" id="sportsFilters"></div><div class="panel" id="events"></div></section><section id="tonightView" class="hidden"><div class="filters"><button class="pill active">Tonight</button><button class="pill">All sports</button></div><div class="panel" id="tonight"></div></section></main><script>const sports=['Football','Rugby','Boxing','UFC','Tennis','Golf','Athletics','Cricket','Cycling','Darts','F1','F2','F3','Horse Racing','Snooker','Motorsport','NFL','NBA','Baseball','Ice Hockey','Wrestling','Other'];const channels=['BBC One','BBC Two','ITV1','Channel 4','Channel 5','Sky Sports Main Event','Sky Sports Football','Sky Sports Arena','Sky Sports+','TNT Sports 1','TNT Sports 2','TNT Sports Ultimate','Premier Sports','Amazon Prime Video','DAZN'];const demo=[['Premier League','Arsenal v Chelsea','Football','Sky Sports Main Event','18:30'],['Championship','Leeds v Norwich','Football','Sky Sports Football','20:00'],['Rugby','Live Rugby','Rugby','TNT Sports 1','19:00'],['UFC Fight Night','Main Card','UFC','TNT Sports Ultimate','21:00'],['Golf','Live Golf','Golf','Sky Sports Golf','17:00']];const now=new Date();const start=new Date(now);start.setMinutes(start.getMinutes()<30?0:30,0,0);document.getElementById('date').textContent=now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});function fmt(d){return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:false})}for(let i=0;i<144;i++){let d=new Date(start.getTime()+i*30*60000),x=document.createElement('div');x.className='time';x.textContent=fmt(d);document.getElementById('times').appendChild(x)}channels.forEach((c,i)=>{let row=document.createElement('div');row.className='row';let d=demo[i%demo.length];row.innerHTML=`<div class="channel">${c}</div><div class="timeline"><div class="programme ${i===5?'live':''}"><strong>${d[1]}</strong><span>${d[0]}</span></div><div class="programme"><strong>${i%2?'Live Sport':'Next event'}</strong><span>${demo[(i+1)%demo.length][0]}</span></div></div>`;document.getElementById('channels').appendChild(row)});const sf=document.getElementById('sportsFilters');sports.forEach((s,i)=>{let b=document.createElement('button');b.className='pill '+(i===0?'active':'');b.textContent=s;b.onclick=()=>{document.querySelectorAll('#sportsFilters .pill').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderEvents(s)};sf.appendChild(b)});function renderEvents(s){let list=demo.filter(x=>x[2]===s);if(!list.length)list=demo;document.getElementById('events').innerHTML=list.map((x,i)=>`<article class="event"><div class="eventtime">${x[4]} · Swiss time</div><div class="eventtitle">${x[1]}</div><div class="meta">${x[0]} · ${x[3]}</div><span class="badge ${i===0?'livebadge':''}">${i===0?'LIVE':'UPCOMING'}</span></article>`).join('')}renderEvents('Football');document.getElementById('tonight').innerHTML=demo.map(x=>`<article class="event"><div class="eventtime">${x[4]}</div><div class="eventtitle">${x[1]}</div><div class="meta">${x[2]} · ${x[0]} · ${x[3]}</div></article>`).join('');document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');['guide','sports','tonight'].forEach(v=>document.getElementById(v+'View').classList.toggle('hidden',v!==t.dataset.view))});</script></body></html>
