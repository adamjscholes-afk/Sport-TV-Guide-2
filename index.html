<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Sport TV Guide"><link rel="manifest" href="manifest.webmanifest"><title>Sport TV Guide</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f5;color:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif}button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}.app{max-width:1400px;margin:auto;padding:18px 14px 44px}.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.brand{font-size:27px;font-weight:750;letter-spacing:-.8px}.sub{font-size:13px;color:#777;margin-top:2px}.icon{width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:0 1px 8px #0000000d;font-size:21px}.tabs{display:flex;background:#e9e9e7;border-radius:14px;padding:3px;margin-bottom:15px}.tab{flex:1;padding:10px 8px;border-radius:11px;font-weight:650;font-size:14px}.tab.active{background:#fff;box-shadow:0 1px 5px #00000012}.filters{display:flex;gap:7px;overflow:auto;padding:2px 1px 9px;margin-bottom:8px;scrollbar-width:none}.pill{white-space:nowrap;padding:9px 13px;border-radius:20px;background:#fff;color:#666;font-size:13px;box-shadow:0 1px 5px #00000008}.pill.active{background:#111;color:#fff}.panel{background:#fff;border-radius:20px;box-shadow:0 2px 14px #00000008;overflow:hidden}.guide{overflow:auto}.grid{min-width:17400px}.row{display:grid;grid-template-columns:160px 1fr;border-bottom:1px solid #eee;min-height:78px}.channel{padding:18px 13px;font-weight:650;border-right:1px solid #eee;position:sticky;left:0;background:#fff;z-index:3;display:flex;align-items:center;gap:7px}.star{font-size:16px;color:#aaa}.star.on{color:#111}.timeline{display:grid;grid-template-columns:repeat(144,120px);position:relative}.time{padding:10px 10px 0;color:#999;font-size:12px;border-right:1px solid #f0f0ef;height:38px}.programme{margin:9px 6px;padding:10px 11px;border-radius:13px;background:#f2f2f0;min-width:0;grid-column:var(--start)/span var(--span);overflow:hidden}.programme.live{background:#111;color:#fff}.programme strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.programme span{display:block;font-size:11px;color:#777;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.live span{color:#bbb}.daybar{display:flex;gap:7px;overflow:auto;padding:0 0 10px}.day{background:#fff;border-radius:12px;padding:8px 12px;font-size:12px;color:#777;box-shadow:0 1px 5px #00000008}.day.active{background:#111;color:#fff}.event{padding:17px;border-bottom:1px solid #eee}.event:last-child{border-bottom:0}.eventtime{font-size:12px;color:#777;margin-bottom:5px}.eventtitle{font-size:18px;font-weight:720;letter-spacing:-.3px}.meta{font-size:13px;color:#777;margin-top:5px}.badge{display:inline-block;margin-top:9px;padding:5px 8px;border-radius:8px;background:#eee;font-size:10px;font-weight:700}.livebadge{background:#111;color:#fff}.empty{padding:42px 20px;text-align:center;color:#777}.status{font-size:12px;color:#777;margin:0 2px 10px}.hidden{display:none}@media(max-width:600px){.app{padding-top:15px}.brand{font-size:24px}.row{grid-template-columns:112px 1fr}.channel{font-size:12px;padding:15px 8px}.grid{min-width:17400px}.timeline{grid-template-columns:repeat(144,120px)}.programme{margin-left:5px;margin-right:5px}.eventtitle{font-size:17px}}
</style></head><body><main class="app">
<header class="header"><div><div class="brand">Sport TV Guide</div><div class="sub" id="date">Loading guide…</div></div><button class="icon" id="favButton" aria-label="Favourites">☆</button></header>
<nav class="tabs"><button class="tab active" data-view="guide">Guide</button><button class="tab" data-view="sports">Sports</button><button class="tab" data-view="tonight">Tonight</button></nav>
<section id="guideView"><div class="daybar" id="days"></div><div class="filters"><button class="pill active" data-mode="all">All channels</button><button class="pill" data-mode="fav">Favourites</button><button class="pill" data-mode="tv">TV</button><button class="pill" data-mode="stream">Streaming</button><button class="pill" id="tzToggle">Swiss time</button></div><div class="status" id="status"></div><div class="panel guide"><div class="grid"><div class="row"><div class="channel"></div><div class="timeline" id="times"></div></div><div id="channels"></div></div></div></section>
<section id="sportsView" class="hidden"><div class="filters" id="sportsFilters"></div><div class="panel" id="events"></div></section>
<section id="tonightView" class="hidden"><div class="filters"><button class="pill active">Tonight</button><button class="pill">All sports</button></div><div class="panel" id="tonight"></div></section>
</main><script>
const sportOrder=['Football','Rugby','Boxing','UFC','Tennis','Golf','Athletics','Cricket','Cycling','Darts','F1','F2','F3','Horse Racing','Snooker','Motorsport','NFL','NBA','Baseball','Ice Hockey','Wrestling','Other'];
let guide=null,events=[],channels=[],displayTz='Europe/Zurich',activeDay=0,mode='all';
const $=id=>document.getElementById(id); const favs=()=>JSON.parse(localStorage.getItem('sport-tv-favourites')||'[]'); const saveFavs=x=>localStorage.setItem('sport-tv-favourites',JSON.stringify(x));
function dt(s){return new Date(s)} function fmt(d){return d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:displayTz})} function dayFmt(d){return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:displayTz})}
function isStream(c){return /amazon|prime video|dazn|discovery\+|disney\+|espn|apple tv|youtube|paramount|stream/i.test(c)}
function channelKey(c){return c.toLowerCase().replace(/[^a-z0-9]+/g,'-')}
function toggleFav(c){let f=favs(),k=channelKey(c);f=f.includes(k)?f.filter(x=>x!==k):[...f,k];saveFavs(f);renderGuide()}
function buildTimeline(start){$('times').innerHTML='';for(let i=0;i<144;i++){let d=new Date(start.getTime()+i*1800000),x=document.createElement('div');x.className='time';x.textContent=fmt(d);$('times').appendChild(x)}}
function renderGuide(){if(!guide)return;let start=new Date(guide.window_start);start.setMinutes(activeDay*1440,0,0);buildTimeline(start);let end=new Date(start.getTime()+72*3600000);let f=favs();let filtered=events.filter(e=>dt(e.end)>start&&dt(e.start)<end);if(mode==='fav')filtered=filtered.filter(e=>f.includes(channelKey(e.channel)));if(mode==='tv')filtered=filtered.filter(e=>!isStream(e.channel));if(mode==='stream')filtered=filtered.filter(e=>isStream(e.channel));channels=[...new Set(filtered.map(e=>e.channel))].sort((a,b)=>a.localeCompare(b));$('channels').innerHTML='';if(!channels.length){$('channels').innerHTML='<div class="empty">No listings match this filter yet.</div>';return}channels.forEach(c=>{let row=document.createElement('div');row.className='row';row.innerHTML=`<div class="channel"><button class="star ${f.includes(channelKey(c))?'on':''}" onclick="toggleFav(${JSON.stringify(c)})">${f.includes(channelKey(c))?'★':'☆'}</button><span>${c}</span></div><div class="timeline"></div>`;let tl=row.querySelector('.timeline');filtered.filter(e=>e.channel===c).forEach(e=>{let s=Math.max(0,Math.floor((dt(e.start)-start)/1800000)+1),en=Math.min(144,Math.ceil((dt(e.end)-start)/1800000)+1),span=Math.max(1,en-s+1);let p=document.createElement('div');p.className='programme '+(dt(e.start)<=new Date()&&dt(e.end)>new Date()?'live':'');p.style.setProperty('--start',s);p.style.setProperty('--span',span);p.innerHTML=`<strong>${e.title||'Sport'}</strong><span>${e.sport||'Sport'} · ${fmt(dt(e.start))}</span>`;tl.appendChild(p)});$('channels').appendChild(row)});$('status').textContent=`${channels.length} channels · ${filtered.length} broadcasts · ${displayTz==='Europe/Zurich'?'Swiss time':'Local time'}`}
function renderEvents(sport){let list=events.filter(e=>!sport||e.sport.toLowerCase()===sport.toLowerCase()).sort((a,b)=>dt(a.start)-dt(b.start));$('events').innerHTML=list.slice(0,250).map(e=>{let live=dt(e.start)<=new Date()&&dt(e.end)>new Date();return `<article class="event"><div class="eventtime">${fmt(dt(e.start))} · ${dayFmt(dt(e.start))}</div><div class="eventtitle">${e.title||'Sport'}</div><div class="meta">${e.sport||'Other'} · ${e.channel}</div><span class="badge ${live?'livebadge':''}">${live?'LIVE':'UPCOMING'}</span></article>`}).join('')||'<div class="empty">No events found.</div>'}
function renderTonight(){let now=new Date(),end=new Date(now);end.setHours(23,59,59,999);let list=events.filter(e=>dt(e.end)>now&&dt(e.start)<end).sort((a,b)=>dt(a.start)-dt(b.start));$('tonight').innerHTML=list.slice(0,150).map(e=>`<article class="event"><div class="eventtime">${fmt(dt(e.start))}</div><div class="eventtitle">${e.title||'Sport'}</div><div class="meta">${e.sport||'Other'} · ${e.channel}</div></article>`).join('')||'<div class="empty">Nothing listed for tonight.</div>'}
function initSports(){let sf=$('sportsFilters');sf.innerHTML='';sportOrder.forEach((s,i)=>{let b=document.createElement('button');b.className='pill '+(i===0?'active':'');b.textContent=s;b.onclick=()=>{document.querySelectorAll('#sportsFilters .pill').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderEvents(s)};sf.appendChild(b)});renderEvents('Football')}
function initDays(){let base=new Date(guide.window_start);for(let i=0;i<3;i++){let b=document.createElement('button');b.className='day '+(i===0?'active':'');b.textContent=i===0?'Now':dayFmt(new Date(base.getTime()+i*86400000));b.onclick=()=>{activeDay=i;document.querySelectorAll('.day').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderGuide()};$('days').appendChild(b)}}
async function load(){try{let r=await fetch('data/guide.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Guide unavailable');guide=await r.json();events=guide.events||[];$('date').textContent=`${dayFmt(new Date())} · updated ${fmt(new Date(guide.generated_at))}`;initDays();initSports();renderGuide();renderTonight()}catch(e){$('date').textContent='Guide data is still being built';$('status').textContent=e.message}}
$('tzToggle').onclick=()=>{displayTz=displayTz==='Europe/Zurich'?Intl.DateTimeFormat().resolvedOptions().timeZone:'Europe/Zurich';$('tzToggle').textContent=displayTz==='Europe/Zurich'?'Swiss time':'Local time';renderGuide();renderEvents(null);renderTonight()};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;renderGuide()});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');['guide','sports','tonight'].forEach(v=>$(v+'View').classList.toggle('hidden',v!==t.dataset.view))});
$('favButton').onclick=()=>{mode='fav';document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x.dataset.mode==='fav'));document.querySelector('[data-view="guide"]').click();renderGuide()};
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
load();
</script></body></html>
