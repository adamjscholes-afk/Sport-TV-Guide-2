name: Normalize BBC One variants

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Normalize BBC One matcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('data_pipeline/scripts/build_guide.py')
          s = p.read_text()
          replacements = [
              ('BBC_ONE_RE=re.compile(r"^bbc\\s+one\\b",re.I)', 'BBC_ONE_RE=re.compile(r"\\bbbc\\s*(?:one|1)\\b",re.I)'),
              ('BBC_ONE_RE=re.compile(r"^bbc\\s*(?:one|1)\\b",re.I)', 'BBC_ONE_RE=re.compile(r"\\bbbc\\s*(?:one|1)\\b",re.I)'),
              ('if BBC_ONE_RE.match(c): return \'BBC One\'', 'if BBC_ONE_RE.search(c): return \'BBC One\''),
          ]
          changed = False
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new, 1)
                  changed = True
          if changed:
              p.write_text(s)
          elif 'if BBC_ONE_RE.search(c): return \'BBC One\'' not in s:
              raise SystemExit('BBC One normalization pattern not found')
          PY
      - name: Commit normalization
        run: |
          git config user.name 'sport-tv-guide-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data_pipeline/scripts/build_guide.py
          if git diff --cached --quiet; then
            echo 'BBC One normalization already applied'
          else
            git commit -m 'Fix BBC One regional channel normalization'
            git push
          fi
