name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build rolling 72-hour guide
        run: python3 data_pipeline/scripts/build_guide.py

      - name: Validate guide
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path('data/guide.json')
          if not p.exists(): raise SystemExit('guide.json missing')
          d = json.loads(p.read_text())
          if 'events' not in d: raise SystemExit('events missing')
          start = datetime.fromisoformat(d['window_start'].replace('Z','+00:00'))
          end = datetime.fromisoformat(d['window_end'].replace('Z','+00:00'))
          hours = (end-start).total_seconds()/3600
          if hours < 71.9: raise SystemExit(f'window is only {hours:.1f} hours')
          if not d['events']: raise SystemExit('no sports events returned')
          if d.get('channel_count',0) < 5: raise SystemExit('suspiciously few sports channels')
          print(f"OK: {len(d['events'])} sports events across {d['channel_count']} channels and {hours:.1f} hours")
          PY

      - name: Publish generated data to repository
        run: |
          git config user.name 'sport-tv-guide-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/guide.json data/health.json
          git diff --cached --quiet || git commit -m 'Refresh 72-hour EPG data'
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
