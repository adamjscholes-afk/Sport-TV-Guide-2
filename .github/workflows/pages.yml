name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build rolling 24-hour guide
        run: python3 data_pipeline/scripts/build_guide.py

      - name: Normalise regional channels
        run: python3 data_pipeline/scripts/normalize_channels.py

      - name: Validate guide
        run: |
          python3 - <<'PY'
          import json,re
          from datetime import datetime
          from pathlib import Path
          d=json.loads(Path('data/guide.json').read_text())
          if 'events' not in d or not d['events']: raise SystemExit('no sports events returned')
          start=datetime.fromisoformat(d['window_start'].replace('Z','+00:00')); end=datetime.fromisoformat(d['window_end'].replace('Z','+00:00'))
          hours=(end-start).total_seconds()/3600
          if not (23.9 <= hours <= 24.1): raise SystemExit(f'window is {hours:.1f} hours, expected 24')
          bad=[c for c in d.get('channels',[]) if re.search(r'^(?:ITV|STV|UTV).*\b(?:London|Granada|Central|Anglia|Meridian|Tyne|Tees|Yorkshire|Border|Westcountry|Wales|Channel|North|South|Scotland)\b',c,re.I)]
          if bad: raise SystemExit('regional channels remain: '+', '.join(bad))
          print(f"OK: {len(d['events'])} sports events across {d['channel_count']} channels and {hours:.1f} hours")
          PY

      - name: Publish generated data to repository
        run: |
          git config user.name 'sport-tv-guide-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/guide.json data/health.json
          git diff --cached --quiet || git commit -m 'Refresh 24-hour EPG data'
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
