name: Build 72-hour sports guide

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build guide
        run: python3 data_pipeline/scripts/build_guide.py
      - name: Commit generated data
        run: |
          git config user.name 'sport-tv-guide-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/guide.json data/health.json
          git diff --cached --quiet || git commit -m 'Refresh sports TV guide data'
          git push
